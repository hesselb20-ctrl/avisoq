name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Compiler, WebAssembly backend
        run: node tests/ci.mjs tests/run.mjs wasm
      - name: Editor support
        if: always()
        run: node tests/ci.mjs tests/ide.mjs
      - name: Packages
        if: always()
        run: node tests/ci.mjs tests/pkg.mjs
      - name: Scripts, manifest, approval, gateway
        if: always()
        run: node tests/ci.mjs tests/act.mjs
      - name: Attempts to get around the limits
        if: always()
        run: node tests/ci.mjs tests/attack.mjs
      - name: Embedding
        if: always()
        run: node tests/ci.mjs tests/embed.mjs
      - name: Limits, host functions and tools
        if: always()
        run: node tests/ci.mjs tests/mcp.mjs
      - name: Documentation examples
        if: always()
        run: node tests/ci.mjs tests/docs.mjs
      - name: Compiler, native backend
        if: always() && runner.os != 'Windows'
        run: node tests/ci.mjs tests/run.mjs native
      - name: Embedding, native library
        if: always() && runner.os != 'Windows'
        run: node tests/ci.mjs tests/embed-native.mjs
